name: Deploy to EC2 tmux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_KEY }}

    - name: Deploy to EC2 (Pure Relay Server)
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@52.78.212.96 << 'EOF'
          echo "=== 기존 tmux 세션 확인 ==="
          
          # tmux session 0이 있는지 확인하고 연결
          if tmux has-session -t 0 2>/dev/null; then
            echo "✅ tmux session 0 발견 - 기존 프로세스 종료"
            tmux send-keys -t 0 C-c
            sleep 3
            pkill -f uvicorn || true
            sleep 3
          else
            echo "⚠️ tmux session 0 없음 - 새로 생성"
            tmux new-session -d -s 0
          fi

          echo "=== 프로젝트 업데이트 ==="
          tmux send-keys -t 0 "cd ~/blackcows-server" Enter
          sleep 1
          tmux send-keys -t 0 "git pull origin main" Enter
          sleep 3
          
          echo "=== 캐시 정리 ==="
          find ~/blackcows-server -type f -name "*.pyc" -delete 2>/dev/null || true
          find ~/blackcows-server -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

          echo "=== 중계 서버 설정 ==="
          cd ~/blackcows-server
          echo "🔄 AWS EC2는 순수 중계 서버 역할"
          echo "🤖 AI 처리는 외부 AI 서버로 전달"
          
          echo "=== 환경변수 파일 확인 ==="
          if [ -f ".env" ]; then
            echo "✅ .env 파일 존재"
            ENV_COUNT=$(grep -v '^#' .env | grep -v '^$' | wc -l)
            echo "📝 환경변수 개수: ${ENV_COUNT}개"
          else
            echo "❌ .env 파일이 없습니다!"
            echo "서버에 .env 파일을 먼저 생성해주세요."
            exit 1
          fi

          echo "=== Python 가상 환경 설정 ==="
          if [ ! -d "venv" ]; then
            echo "가상환경 생성 중..."
            python3.11 -m venv venv
          fi
          
          tmux send-keys -t 0 "source venv/bin/activate" Enter
          sleep 3
      
          echo "=== 패키지 업데이트 ==="
          tmux send-keys -t 0 "pip install --upgrade pip" Enter
          sleep 3
          tmux send-keys -t 0 "pip install --upgrade --force-reinstall bcrypt==4.0.1 passlib[bcrypt]==1.7.4" Enter
          sleep 5
          tmux send-keys -t 0 "pip install -r requirements.txt" Enter
          sleep 18

          echo "=== 구문 검사 ==="
          python3 -m py_compile main.py

          echo "=== 서버 시작 ==="
          tmux send-keys -t 0 "uvicorn main:app --host 0.0.0.0 --port 8000 --log-level info --access-log" Enter
          sleep 10

          echo "=== 외부 AI 서버 연결 확인 ==="
          AI_SERVER_SUCCESS=false
          echo "🔍 외부 AI 서버 헬스체크 중..."
          
          if curl -f -m 10 https://feof-implement-finnish-finally.trycloudflare.com/health >/dev/null 2>&1; then
            echo "✅ 외부 AI 서버 연결 성공 (/health)"
            AI_SERVER_SUCCESS=true
          elif curl -f -m 10 https://feof-implement-finnish-finally.trycloudflare.com/ >/dev/null 2>&1; then
            echo "✅ 외부 AI 서버 연결 성공 (루트 경로)"
            AI_SERVER_SUCCESS=true
          else
            echo "⚠️ 외부 AI 서버 연결 실패 (AI 기능 제한됨)"
          fi

          echo "=== tmux 세션 확인 ==="
          if tmux has-session -t 0 2>/dev/null; then
            echo "✅ tmux session 실행 중"
            tmux capture-pane -t 0 -p | tail -15
            
            ERROR_COUNT=$(tmux capture-pane -t 0 -p | grep -i error | wc -l)
            if [ $ERROR_COUNT -gt 0 ]; then
              echo "⚠️ 에러 발견 (${ERROR_COUNT}개)"
              tmux capture-pane -t 0 -p | grep -i error | tail -3
            else
              echo "✅ 에러 없음"
            fi
          else
            echo "❌ tmux session 실행 안됨"
            exit 1
          fi

          echo "=== 포트 확인 ==="
          PORT_CHECK_SUCCESS=false
          if ss -tlnp | grep ':8000'; then
            echo "✅ 포트 8000 사용 중"
            PORT_CHECK_SUCCESS=true
          fi
          if ps aux | grep uvicorn | grep -v grep | grep 8000; then
            echo "✅ uvicorn 프로세스 실행 중"
            PORT_CHECK_SUCCESS=true
          fi

          echo "=== AWS EC2 헬스체크 ==="
          sleep 5
          HEALTH_CHECK_SUCCESS=false
          ROOT_CHECK_SUCCESS=false
          
          if curl -f -m 10 http://localhost:8000/health >/dev/null 2>&1; then
            echo "✅ /health 응답 성공"
            HEALTH_CHECK_SUCCESS=true
          fi
          if curl -f -m 10 http://localhost:8000/ >/dev/null 2>&1; then
            echo "✅ 루트 경로 응답 성공"
            ROOT_CHECK_SUCCESS=true
          fi

          # 배포 성공 체크
          if [ "$HEALTH_CHECK_SUCCESS" = true ] || [ "$ROOT_CHECK_SUCCESS" = true ] || [ "$PORT_CHECK_SUCCESS" = true ]; then
            echo ""
            echo "🎉 AWS EC2 서버 시작 성공!"
            echo "🎯 서버: https://api.blackcowsdairy.com"
            echo "📚 API 문서: https://api.blackcowsdairy.com/docs"
            echo "🖥️ tmux 접속: tmux attach-session -t 0"
            echo ""
            echo "=== 배포 상태 요약 ==="
            echo "✅ Git 업데이트"
            echo "✅ 환경 변수 설정"
            echo "✅ tmux session 실행"
            echo "✅ 패키지 업데이트"
            echo "✅ AWS EC2 서버 정상"
            
            if [ "$HEALTH_CHECK_SUCCESS" = true ]; then
              echo "✅ 헬스체크 통과"
            fi
            if [ "$ROOT_CHECK_SUCCESS" = true ]; then
              echo "✅ 루트 경로 정상"
            fi
            if [ "$PORT_CHECK_SUCCESS" = true ]; then
              echo "✅ 포트 8000 정상"
            fi
            if [ "$AI_SERVER_SUCCESS" = true ]; then
              echo "✅ 외부 AI 서버 연결 정상"
            else
              echo "⚠️ 외부 AI 서버 연결 제한됨"
            fi
            
            echo ""
            echo "🚀 서버 배포 완료!"
            echo "🤖 AI 처리: 외부 AI 서버로 전달"
            echo "💡 로그 확인: tmux attach-session -t 0"
            echo "💡 tmux 나가기: Ctrl+B → D"
          else
            echo "❌ 서버 시작 실패"
            tmux capture-pane -t 0 -p
            exit 1
          fi
        EOF
