name: Deploy to EC2 tmux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_KEY }}

    - name: Deploy to EC2 (Pure Relay Server)
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@52.78.212.96 << 'EOF'
          echo "=== 기존 tmux 세션 확인 ==="
          
          # tmux session 0이 있는지 확인하고 연결
          if tmux has-session -t 0 2>/dev/null; then
            echo "✅ tmux session 0 발견 - 기존 프로세스 종료"
            # 기존 실행 중인 프로세스 종료 (Ctrl+C)
            tmux send-keys -t 0 C-c
            sleep 3
            
            # 추가로 uvicorn 프로세스가 남아있다면 강제 종료
            pkill -f uvicorn || true
            sleep 3
            
          else
            echo "⚠️ tmux session 0 없음 - 새로 생성"
            tmux new-session -d -s 0
          fi

          echo "=== 프로젝트 업데이트 ==="
          tmux send-keys -t 0 "cd ~/blackcows-server" Enter
          sleep 1
          tmux send-keys -t 0 "git pull origin main" Enter
          sleep 3
          
          echo "=== 캐시 정리 ==="
          find ~/blackcows-server -type f -name "*.pyc" -delete 2>/dev/null || true
          find ~/blackcows-server -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

          echo "=== 중계 서버 설정 ==="
          cd ~/blackcows-server
          echo "🔄 AWS EC2는 순수 중계 서버 역할"
          echo "🤖 AI 처리는 외부 AI 서버로 전달"
          
          echo "=== 환경변수 파일 확인 ==="
          if [ -f ".env" ]; then
            echo "✅ .env 파일 존재"
            echo "📝 환경변수 개수: $(grep -v '^#' .env | grep -v '^

          echo "=== Firebase 설정 확인 ==="
          if [ -f "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" ]; then
            echo "✅ Firebase 키 파일 존재"
          else
            echo "❌ Firebase 키 파일 없음"
            echo "파일을 확인하거나 올바른 경로를 설정하세요."
            exit 1
          fi

          echo "=== Python 가상 환경 설정 ==="
          # 가상환경 생성 (없을 경우에만)
          if [ ! -d "venv" ]; then
            echo "가상환경 생성 중..."
            python3.11 -m venv venv
          fi
          
          # tmux 세션에서 가상환경 활성화
          tmux send-keys -t 0 "source venv/bin/activate" Enter
          sleep 3
      
          echo "=== 패키지 업데이트 ==="
          tmux send-keys -t 0 "pip install --upgrade pip" Enter
          sleep 3
          tmux send-keys -t 0 "pip install --upgrade --force-reinstall bcrypt==4.0.1 passlib[bcrypt]==1.7.4" Enter
          sleep 5
          tmux send-keys -t 0 "pip install -r requirements.txt" Enter
          sleep 18

          echo "=== 구문 검사 ==="
          python3 -m py_compile main.py

          echo "=== 서버 시작 ==="
          sleep 1
          tmux send-keys -t 0 "uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level info --access-log" Enter
          
          echo "=== 서버 시작 대기 ==="
          sleep 10

          echo "=== 외부 AI 서버 연결 확인 ==="
          AI_SERVER_SUCCESS=false
          echo "🔍 외부 AI 서버 헬스체크 중..."
          
          # 여러 헬스체크 엔드포인트 시도
          if curl -f -m 10 https://feof-implement-finnish-finally.trycloudflare.com/health >/dev/null 2>&1; then
            echo "✅ 외부 AI 서버 연결 성공 (/health)"
            AI_SERVER_SUCCESS=true
          elif curl -f -m 10 https://feof-implement-finnish-finally.trycloudflare.com/ >/dev/null 2>&1; then
            echo "✅ 외부 AI 서버 연결 성공 (루트 경로)"
            AI_SERVER_SUCCESS=true
          else
            echo "⚠️ 외부 AI 서버 연결 실패 (AI 기능 제한됨)"
            echo "🔍 디버깅: curl -v https://feof-implement-finnish-finally.trycloudflare.com/health"
          fi

          echo "=== tmux 세션 확인 ==="
          if tmux has-session -t 0 2>/dev/null; then
            echo "✅ tmux session 실행 중"
            
            echo "=== 최근 로그 확인 ==="
            tmux capture-pane -t 0 -p | tail -15
            
            ERROR_COUNT=$(tmux capture-pane -t 0 -p | grep -i error | wc -l)
            if [ $ERROR_COUNT -gt 0 ]; then
              echo "⚠️ 에러 발견 ($ERROR_COUNT개)"
              tmux capture-pane -t 0 -p | grep -i error | tail -3
            else
              echo "✅ 에러 없음"
            fi
          else
            echo "❌ tmux session 실행 안됨"
            exit 1
          fi

          echo "=== 포트 확인 ==="
          PORT_CHECK_SUCCESS=false
          
          if ss -tlnp | grep ':8000'; then
            echo "✅ 포트 8000 사용 중"
            PORT_CHECK_SUCCESS=true
          fi
          
          if ps aux | grep uvicorn | grep -v grep | grep 8000; then
            echo "✅ uvicorn 프로세스 실행 중"
            PORT_CHECK_SUCCESS=true
          fi

          echo "=== AWS EC2 헬스체크 ==="
          sleep 5
          
          HEALTH_CHECK_SUCCESS=false
          ROOT_CHECK_SUCCESS=false
          
          if curl -f -m 10 http://localhost:8000/health >/dev/null 2>&1; then
            echo "✅ /health 응답 성공"
            HEALTH_CHECK_SUCCESS=true
          fi
          
          if curl -f -m 10 http://localhost:8000/ >/dev/null 2>&1; then
            echo "✅ 루트 경로 응답 성공"
            ROOT_CHECK_SUCCESS=true
          fi

          # ===== AI 중계 기능 종합 테스트 (AI 서버가 살아있을 때만) =====
          AI_MILK_YIELD_SUCCESS=false
          AI_MASTITIS_SUCCESS=false
          AI_SCC_MASTITIS_SUCCESS=false
          AI_HEALTH_SUCCESS=false
          
          if [ "$AI_SERVER_SUCCESS" = true ]; then
            echo ""
            echo "🤖 === AI 중계 기능 종합 테스트 시작 ==="
            echo ""
            
            # 1️⃣ 착유량 예측 테스트
            echo "🥛 [1/4] 착유량 예측 테스트 중..."
            MILK_YIELD_RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET http://localhost:8000/ai/test/sample-predict)
            if [ "$MILK_YIELD_RESPONSE_CODE" = "200" ]; then
              echo "✅ 착유량 예측 테스트 성공 (응답코드: $MILK_YIELD_RESPONSE_CODE)"
              AI_MILK_YIELD_SUCCESS=true
              
              # 실제 예측 결과 확인
              MILK_YIELD_RESULT=$(curl -s -X GET http://localhost:8000/ai/test/sample-predict | jq -r '.predicted_milk_yield // "null"' 2>/dev/null || echo "parse_error")
              if [ "$MILK_YIELD_RESULT" != "null" ] && [ "$MILK_YIELD_RESULT" != "parse_error" ]; then
                echo "  📊 예측 착유량: ${MILK_YIELD_RESULT}L"
              fi
            else
              echo "❌ 착유량 예측 테스트 실패 (응답코드: $MILK_YIELD_RESPONSE_CODE)"
              echo "🔍 상세 정보:"
              curl -s -X GET http://localhost:8000/ai/test/sample-predict | head -3
            fi
            
            sleep 2
            
            # 2️⃣ 유방염 예측 테스트
            echo "🔬 [2/4] 유방염 예측 테스트 중..."
            MASTITIS_RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET http://localhost:8000/ai/test/sample-mastitis-predict)
            if [ "$MASTITIS_RESPONSE_CODE" = "200" ]; then
              echo "✅ 유방염 예측 테스트 성공 (응답코드: $MASTITIS_RESPONSE_CODE)"
              AI_MASTITIS_SUCCESS=true
              
              # 실제 예측 결과 확인
              MASTITIS_RESULT=$(curl -s -X GET http://localhost:8000/ai/test/sample-mastitis-predict | jq -r '.prediction_class_label // "null"' 2>/dev/null || echo "parse_error")
              if [ "$MASTITIS_RESULT" != "null" ] && [ "$MASTITIS_RESULT" != "parse_error" ]; then
                echo "  🩺 유방염 상태: $MASTITIS_RESULT"
              fi
            else
              echo "❌ 유방염 예측 테스트 실패 (응답코드: $MASTITIS_RESPONSE_CODE)"
              echo "🔍 상세 정보:"
              curl -s -X GET http://localhost:8000/ai/test/sample-mastitis-predict | head -3
            fi
            
            sleep 2
            
            # 3️⃣ 체세포수 기반 유방염 예측 테스트
            echo "🧪 [3/4] 체세포수 기반 유방염 예측 테스트 중..."
            SCC_MASTITIS_RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET http://localhost:8000/ai/test/sample-scc-mastitis-predict)
            if [ "$SCC_MASTITIS_RESPONSE_CODE" = "200" ]; then
              echo "✅ 체세포수 기반 유방염 예측 테스트 성공 (응답코드: $SCC_MASTITIS_RESPONSE_CODE)"
              AI_SCC_MASTITIS_SUCCESS=true
              
              # 실제 예측 결과 확인
              SCC_MASTITIS_RESULT=$(curl -s -X GET http://localhost:8000/ai/test/sample-scc-mastitis-predict | jq -r '.prediction_class_label // "null"' 2>/dev/null || echo "parse_error")
              if [ "$SCC_MASTITIS_RESULT" != "null" ] && [ "$SCC_MASTITIS_RESULT" != "parse_error" ]; then
                echo "  🔬 체세포수 기반 유방염 상태: $SCC_MASTITIS_RESULT"
              fi
            else
              echo "❌ 체세포수 기반 유방염 예측 테스트 실패 (응답코드: $SCC_MASTITIS_RESPONSE_CODE)"
              echo "🔍 상세 정보:"
              curl -s -X GET http://localhost:8000/ai/test/sample-scc-mastitis-predict | head -3
            fi
            
            sleep 2
            
            # 4️⃣ AI 서버 상태 확인
            echo "⚕️ [4/4] AI 서버 상태 확인 중..."
            AI_HEALTH_RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET http://localhost:8000/ai/health)
            if [ "$AI_HEALTH_RESPONSE_CODE" = "200" ]; then
              echo "✅ AI 서버 상태 확인 성공 (응답코드: $AI_HEALTH_RESPONSE_CODE)"
              AI_HEALTH_SUCCESS=true
              
              # AI 서버 상태 상세 정보
              AI_STATUS=$(curl -s -X GET http://localhost:8000/ai/health | jq -r '.service_ready // "null"' 2>/dev/null || echo "parse_error")
              if [ "$AI_STATUS" = "true" ]; then
                echo "  🟢 AI 서비스: 정상 작동"
              elif [ "$AI_STATUS" = "false" ]; then
                echo "  🟡 AI 서비스: 제한적 작동"
              else
                echo "  🔍 AI 서비스: 상태 확인 불가"
              fi
            else
              echo "❌ AI 서버 상태 확인 실패 (응답코드: $AI_HEALTH_RESPONSE_CODE)"
              echo "🔍 상세 정보:"
              curl -s -X GET http://localhost:8000/ai/health | head -3
            fi
            
            echo ""
            echo "🤖 === AI 중계 기능 테스트 완료 ==="
            
            # AI 테스트 결과 요약
            AI_TEST_PASSED=0
            AI_TEST_TOTAL=4
            
            if [ "$AI_MILK_YIELD_SUCCESS" = true ]; then
              AI_TEST_PASSED=$((AI_TEST_PASSED + 1))
            fi
            if [ "$AI_MASTITIS_SUCCESS" = true ]; then
              AI_TEST_PASSED=$((AI_TEST_PASSED + 1))
            fi
            if [ "$AI_SCC_MASTITIS_SUCCESS" = true ]; then
              AI_TEST_PASSED=$((AI_TEST_PASSED + 1))
            fi
            if [ "$AI_HEALTH_SUCCESS" = true ]; then
              AI_TEST_PASSED=$((AI_TEST_PASSED + 1))
            fi
            
            echo "📊 AI 테스트 결과: $AI_TEST_PASSED/$AI_TEST_TOTAL 통과"
            
            if [ $AI_TEST_PASSED -eq $AI_TEST_TOTAL ]; then
              echo "🎉 모든 AI 기능 테스트 통과!"
              AI_RELAY_SUCCESS=true
            elif [ $AI_TEST_PASSED -gt 0 ]; then
              echo "⚠️ 일부 AI 기능 테스트 통과 (부분적 정상)"
              AI_RELAY_SUCCESS=partial
            else
              echo "❌ 모든 AI 기능 테스트 실패"
              AI_RELAY_SUCCESS=false
            fi
            
          else
            echo "⚠️ 외부 AI 서버 연결 불가로 AI 중계 테스트 건너뜀"
            AI_RELAY_SUCCESS=false
          fi

          # 추가 디버깅 정보 (테스트 실패 시)
          if [ "$AI_RELAY_SUCCESS" = false ] && [ "$AI_SERVER_SUCCESS" = true ]; then
            echo ""
            echo "🔍 === AI 테스트 실패 디버깅 정보 ==="
            echo "서버 로그 (최근 10줄):"
            tmux capture-pane -t 0 -p | tail -10
            echo ""
            echo "AI 서버 직접 연결 테스트:"
            curl -v -m 5 https://feof-implement-finnish-finally.trycloudflare.com/health 2>&1 | head -10
            echo "=== 디버깅 정보 끝 ==="
            echo ""
          fi

          if [ "$HEALTH_CHECK_SUCCESS" = true ] || [ "$ROOT_CHECK_SUCCESS" = true ] || [ "$PORT_CHECK_SUCCESS" = true ]; then
            echo ""
            echo "🎉 AWS EC2 서버 시작 성공!"
            echo "🎯 서버: https://api.blackcowsdairy.com"
            echo "📚 API 문서: https://api.blackcowsdairy.com/docs"
            echo "🖥️ tmux 접속: tmux attach-session -t 0"
            echo ""
            echo "=== 배포 상태 요약 ==="
            echo "✅ Git 업데이트"
            echo "✅ 환경 변수 설정"
            echo "✅ Firebase 설정"
            echo "✅ tmux session 실행"
            echo "✅ 패키지 업데이트"
            echo "✅ AWS EC2 서버 정상"
            
            if [ "$HEALTH_CHECK_SUCCESS" = true ]; then
              echo "✅ 헬스체크 통과"
            fi
            if [ "$ROOT_CHECK_SUCCESS" = true ]; then
              echo "✅ 루트 경로 정상"
            fi
            if [ "$PORT_CHECK_SUCCESS" = true ]; then
              echo "✅ 포트 8000 정상"
            fi
            if [ "$AI_SERVER_SUCCESS" = true ]; then
              echo "✅ 외부 AI 서버 연결 정상"
            else
              echo "⚠️ 외부 AI 서버 연결 제한됨"
            fi
            
            # AI 기능별 상태 표시
            if [ "$AI_RELAY_SUCCESS" = true ]; then
              echo "✅ AI 중계 기능 완전 정상"
              echo "  ✅ 착유량 예측"
              echo "  ✅ 유방염 예측" 
              echo "  ✅ 체세포수 기반 유방염 예측"
              echo "  ✅ AI 서버 상태 확인"
            elif [ "$AI_RELAY_SUCCESS" = "partial" ]; then
              echo "⚠️ AI 중계 기능 부분 정상"
              if [ "$AI_MILK_YIELD_SUCCESS" = true ]; then
                echo "  ✅ 착유량 예측"
              else
                echo "  ❌ 착유량 예측"
              fi
              if [ "$AI_MASTITIS_SUCCESS" = true ]; then
                echo "  ✅ 유방염 예측"
              else
                echo "  ❌ 유방염 예측"
              fi
              if [ "$AI_SCC_MASTITIS_SUCCESS" = true ]; then
                echo "  ✅ 체세포수 기반 유방염 예측"
              else
                echo "  ❌ 체세포수 기반 유방염 예측"
              fi
              if [ "$AI_HEALTH_SUCCESS" = true ]; then
                echo "  ✅ AI 서버 상태 확인"
              else
                echo "  ❌ AI 서버 상태 확인"
              fi
            else
              echo "⚠️ AI 중계 기능 제한됨"
              echo "  ❌ 착유량 예측"
              echo "  ❌ 유방염 예측"
              echo "  ❌ 체세포수 기반 유방염 예측"
              echo "  ❌ AI 서버 상태 확인"
            fi
            
            echo ""
            echo "🚀 서버 배포 완료!"
            echo "🤖 AI 처리: 외부 AI 서버로 전달"
            echo "💡 로그 확인: tmux attach-session -t 0"
            echo "💡 tmux 나가기: Ctrl+B → D"
            
            # AI 테스트 결과에 따른 추가 안내
            if [ "$AI_RELAY_SUCCESS" = true ]; then
              echo ""
              echo "🎉 모든 AI 기능이 정상 작동합니다!"
              echo "📱 Flutter 앱에서 AI 예측 기능을 안전하게 사용할 수 있습니다."
            elif [ "$AI_RELAY_SUCCESS" = "partial" ]; then
              echo ""
              echo "⚠️ 일부 AI 기능에 문제가 있습니다."
              echo "🔧 AI 서버를 확인하거나 잠시 후 다시 시도해주세요."
            else
              echo ""
              echo "⚠️ AI 기능이 제한됩니다."
              echo "🔧 로컬 AI 서버 상태를 확인해주세요."
              echo "🔗 AI 서버 URL: https://feof-implement-finnish-finally.trycloudflare.com"
            fi
            
          else
            echo "❌ 서버 시작 실패"
            tmux capture-pane -t 0 -p
            exit 1
          fi

        EOF
