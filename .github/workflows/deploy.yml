name: Deploy to EC2 tmux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_KEY }}

    - name: Deploy to EC2 (Pure Relay Server)
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@52.78.212.96 << 'EOF'
          echo "=== 기존 tmux 세션 확인 ==="
          
          # tmux session 0이 있는지 확인하고 연결
          if tmux has-session -t 0 2>/dev/null; then
            echo "✅ tmux session 0 발견 - 기존 프로세스 종료"
            # 기존 실행 중인 프로세스 종료 (Ctrl+C)
            tmux send-keys -t 0 C-c
            sleep 3
            
            # 추가로 uvicorn 프로세스가 남아있다면 강제 종료
            pkill -f uvicorn || true
            sleep 3
            
          else
            echo "⚠️ tmux session 0 없음 - 새로 생성"
            tmux new-session -d -s 0
          fi

          echo "=== 프로젝트 업데이트 ==="
          tmux send-keys -t 0 "cd ~/blackcows-server" Enter
          sleep 1
          tmux send-keys -t 0 "git pull origin main" Enter
          sleep 3
          
          echo "=== 캐시 정리 ==="
          find ~/blackcows-server -type f -name "*.pyc" -delete 2>/dev/null || true
          find ~/blackcows-server -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

          echo "=== 중계 서버 설정 ==="
          cd ~/blackcows-server
          echo "🔄 AWS EC2는 순수 중계 서버 역할"
          echo "🤖 AI 처리는 외부 AI 서버로 전달"

          echo "=== Firebase 설정 확인 ==="
          if [ -f "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" ]; then
            echo "✅ Firebase 키 파일 존재"
          else
            echo "❌ Firebase 키 파일 없음"
            echo "파일을 확인하거나 올바른 경로를 설정하세요."
            exit 1
          fi

          echo "=== 환경변수 설정 ==="
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" > .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "REFRESH_TOKEN_EXPIRE_DAYS=7" >> .env
          echo "ENVIRONMENT=production" >> .env
          echo "EC2_HOST=${{ secrets.EC2_HOST }}" >> .env
          echo "EC2_USER=${{ secrets.EC2_USER }}" >> .env
          echo "EC2_KEY=${{ secrets.EC2_KEY }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_PRIVATE_KEY_ID=${{ secrets.FIREBASE_PRIVATE_KEY_ID }}" >> .env
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env
          echo "FIREBASE_CLIENT_ID=${{ secrets.FIREBASE_CLIENT_ID }}" >> .env
          echo "FIREBASE_PRIVATE_KEY=\"${{ secrets.FIREBASE_PRIVATE_KEY }}\"" >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "LIVESTOCK_TRACE_API_DECODING_KEY=${{ secrets.LIVESTOCK_TRACE_API_DECODING_KEY }}" >> .env
          echo "LIVESTOCK_TRACE_API_ENCODING_KEY=${{ secrets.LIVESTOCK_TRACE_API_ENCODING_KEY }}" >> .env
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "FROM_EMAIL=${{ secrets.FROM_EMAIL }}" >> .env
          echo "FROM_NAME=${{ secrets.FROM_NAME }}" >> .env
          echo "SMTP_SERVER=${{ secrets.SMTP_SERVER }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "AI_SERVER_URL=https://feof-implement-finnish-finally.trycloudflare.com" >> .env
          chmod 600 .env

          echo "=== Python 가상 환경 설정 ==="
          # 가상환경 생성 (없을 경우에만)
          if [ ! -d "venv" ]; then
            echo "가상환경 생성 중..."
            python3.11 -m venv venv
          fi
          
          # tmux 세션에서 가상환경 활성화
          tmux send-keys -t 0 "source venv/bin/activate" Enter
          sleep 3
      
          echo "=== 패키지 업데이트 ==="
          tmux send-keys -t 0 "pip install --upgrade pip" Enter
          sleep 3
          tmux send-keys -t 0 "pip install --upgrade --force-reinstall bcrypt==4.0.1 passlib[bcrypt]==1.7.4" Enter
          sleep 5
          tmux send-keys -t 0 "pip install -r requirements.txt" Enter
          sleep 18

          echo "=== 구문 검사 ==="
          python3 -m py_compile main.py

          echo "=== 서버 시작 ==="
          tmux send-keys -t 0 "export GOOGLE_APPLICATION_CREDENTIALS=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" Enter
          sleep 1
          tmux send-keys -t 0 "export LIVESTOCK_TRACE_API_DECODING_KEY=${{ secrets.LIVESTOCK_TRACE_API_DECODING_KEY }}" Enter
          sleep 1
          tmux send-keys -t 0 "export SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" Enter
          sleep 1
          tmux send-keys -t 0 "export SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" Enter
          sleep 1
          tmux send-keys -t 0 "export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" Enter
          sleep 1
          tmux send-keys -t 0 "uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level info --access-log" Enter
          
          echo "=== 서버 시작 대기 ==="
          sleep 10

          echo "=== 외부 AI 서버 연결 확인 ==="
          AI_SERVER_SUCCESS=false
          echo "🔍 외부 AI 서버 헬스체크 중..."
          
          if curl -f -m 10 https://feof-implement-finnish-finally.trycloudflare.com/ai/model-health >/dev/null 2>&1; then
            echo "✅ 외부 AI 서버 연결 성공"
            AI_SERVER_SUCCESS=true
          else
            echo "⚠️ 외부 AI 서버 연결 실패 (AI 기능 제한됨)"
          fi

          echo "=== tmux 세션 확인 ==="
          if tmux has-session -t 0 2>/dev/null; then
            echo "✅ tmux session 실행 중"
            
            echo "=== 최근 로그 확인 ==="
            tmux capture-pane -t 0 -p | tail -15
            
            ERROR_COUNT=$(tmux capture-pane -t 0 -p | grep -i error | wc -l)
            if [ $ERROR_COUNT -gt 0 ]; then
              echo "⚠️ 에러 발견 ($ERROR_COUNT개)"
              tmux capture-pane -t 0 -p | grep -i error | tail -3
            else
              echo "✅ 에러 없음"
            fi
          else
            echo "❌ tmux session 실행 안됨"
            exit 1
          fi

          echo "=== 포트 확인 ==="
          PORT_CHECK_SUCCESS=false
          
          if ss -tlnp | grep ':8000'; then
            echo "✅ 포트 8000 사용 중"
            PORT_CHECK_SUCCESS=true
          fi
          
          if ps aux | grep uvicorn | grep -v grep | grep 8000; then
            echo "✅ uvicorn 프로세스 실행 중"
            PORT_CHECK_SUCCESS=true
          fi

          echo "=== AWS EC2 헬스체크 ==="
          sleep 5
          
          HEALTH_CHECK_SUCCESS=false
          ROOT_CHECK_SUCCESS=false
          
          if curl -f -m 10 http://localhost:8000/health >/dev/null 2>&1; then
            echo "✅ /health 응답 성공"
            HEALTH_CHECK_SUCCESS=true
          fi
          
          if curl -f -m 10 http://localhost:8000/ >/dev/null 2>&1; then
            echo "✅ 루트 경로 응답 성공"
            ROOT_CHECK_SUCCESS=true
          fi

          # AI 중계 기능 테스트 (AI 서버가 살아있을 때만)
          AI_RELAY_SUCCESS=false
          if [ "$AI_SERVER_SUCCESS" = true ]; then
            if curl -f -m 15 http://localhost:8000/api/ai-prediction/test/model-health >/dev/null 2>&1; then
              echo "✅ AI 중계 기능 테스트 성공"
              AI_RELAY_SUCCESS=true
            else
              echo "⚠️ AI 중계 기능 테스트 실패"
            fi
          else
            echo "⚠️ 외부 AI 서버 연결 불가로 AI 중계 테스트 건너뜀"
          fi

          if [ "$HEALTH_CHECK_SUCCESS" = true ] || [ "$ROOT_CHECK_SUCCESS" = true ] || [ "$PORT_CHECK_SUCCESS" = true ]; then
            echo ""
            echo "🎉 AWS EC2 서버 시작 성공!"
            echo "🎯 서버: https://api.blackcowsdairy.com"
            echo "📚 API 문서: https://api.blackcowsdairy.com/docs"
            echo "🖥️ tmux 접속: tmux attach-session -t 0"
            echo ""
            echo "=== 배포 상태 ==="
            echo "✅ Git 업데이트"
            echo "✅ 환경 변수 설정"
            echo "✅ Firebase 설정"
            echo "✅ tmux session 실행"
            echo "✅ 패키지 업데이트"
            echo "✅ AWS EC2 서버 정상"
            if [ "$HEALTH_CHECK_SUCCESS" = true ]; then
              echo "✅ 헬스체크 통과"
            fi
            if [ "$ROOT_CHECK_SUCCESS" = true ]; then
              echo "✅ 루트 경로 정상"
            fi
            if [ "$PORT_CHECK_SUCCESS" = true ]; then
              echo "✅ 포트 8000 정상"
            fi
            if [ "$AI_SERVER_SUCCESS" = true ]; then
              echo "✅ 외부 AI 서버 연결 정상"
            else
              echo "⚠️ 외부 AI 서버 연결 제한됨"
            fi
            if [ "$AI_RELAY_SUCCESS" = true ]; then
              echo "✅ AI 중계 기능 정상"
            else
              echo "⚠️ AI 중계 기능 제한됨"
            fi
            echo ""
            echo "🚀 서버 배포 완료!"
            echo "🤖 AI 처리: 외부 AI 서버로 전달"
            echo "💡 로그 확인: tmux attach-session -t 0"
            echo "💡 tmux 나가기: Ctrl+B → D"
            
          else
            echo "❌ 서버 시작 실패"
            tmux capture-pane -t 0 -p
            exit 1
          fi

        EOF
